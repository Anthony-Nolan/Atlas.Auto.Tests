# Build, then one job on one agent that runs the test runs one after another. A test run is one dotnet test call over
# its categories; the tests run in parallel in that process (LevelOfParallelism in AssemblyInfo.cs). A test run starts
# only when the one before it passed.
# Scripts are in pipeline/ (the pipeline-scripts artifact of the build stage).
parameters:
# Each: name, displayName, categories (tag -> its categories; a category's test run gets its tag), and optionally
# extraTestArguments (more dotnet test arguments).
- name: testRuns
  type: object
  default: []
# Azure:ChangeFunctionAppSettings of the tests: false leaves the Atlas function apps as they are and skips the tests marked
# [RequiresAppSetting].
- name: changeFunctionAppSettings
  type: boolean
  default: true
# Pipeline name -> its Azure service connection (see test-pipeline.yml).
- name: azureServiceConnections
  type: object
  default: {}

stages:
- stage: build
  displayName: "Build"
  jobs:
  - job:
    displayName: 'Restore Cache and Build'
    pool:
      vmImage: 'windows-latest'
    variables:
      buildConfiguration: 'Release'
      # Set into appsettings.json by the 'Set environment variables' step
      Azure.ChangeFunctionAppSettings: ${{ parameters.changeFunctionAppSettings }}
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET Core SDK'
        inputs:
          packageType: 'sdk'
          version: 10.0.x

      - task: FileTransform@2
        # Pipeline must have variables that match those in appsettings.json.
        # Use `.` to retrieve nested values, e.g., var name `Azure.FunctionApps.Search` maps to `{ "Azure": { "FunctionApps": { "Search": "value" } } }`
        # appsettings.json holds no secrets, so none end up in the dropTestSuite artifact: the tests read them from the
        # environment's Atlas Key Vault (KeyVault.Name) and the Public API key through ARM.
        displayName: 'Set environment variables'
        inputs:
          folderPath: '$(System.DefaultWorkingDirectory)'
          xmlTransformationRules: '' # Prevents task error: "Unable to apply transformation for the given package - Changes are already present in the package."
          jsonTargetFiles: '**/appsettings.json'
        continueOnError: false

      - task: DotNetCoreCLI@2
        displayName: 'Restore'
        inputs:
          command: 'restore'
          projects: "**/Atlas.Auto.Tests.csproj"
          feedsToUse: 'select'
          vstsFeed: $(ATLAS_AZURE_ARTIFACTS_FEED_NAME_OR_ID)
          includeNuGetOrg: true

      - task: DotNetCoreCLI@2
        displayName: 'Build'
        inputs:
          command: 'build'
          projects: '**/Atlas.Auto.Tests.csproj'
          arguments: '--configuration $(buildConfiguration) --no-restore'

      - task: CopyFiles@2
        displayName: 'Copy Test artifacts for later use in the pipeline'
        inputs:
          contents: 'Atlas.Auto.Tests/bin/Release/net10.0/**'
          targetFolder: '$(Build.ArtifactStagingDirectory)'

      - publish: '$(Build.ArtifactStagingDirectory)'
        displayName: 'Publish Test artifacts for later use in the pipeline'
        artifact: dropTestSuite

      - publish: '$(System.DefaultWorkingDirectory)/pipeline'
        displayName: 'Publish pipeline scripts'
        artifact: pipeline-scripts

# The test runs must not overlap: every one starts by removing all test donors (AssemblySetup).
- stage: tests
  displayName: "Tests"
  jobs:
  - job: Tests
    displayName: 'Tests run'
    pool:
      vmImage: 'windows-latest'
    # The test run timeouts are for a run that hangs; all the runs take about 20 min.
    timeoutInMinutes: 120
    steps:
    - checkout: none

    - download: current
      displayName: 'Download pipeline scripts'
      artifact: pipeline-scripts

    - download: current
      displayName: 'Download test binaries'
      artifact: dropTestSuite

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: 10.0.x

    # Names this pipeline's service connection, which Azure DevOps requires before it issues tokens for it, and passes its
    # IDs on to the test steps (E2E.* variables -> AZURESUBSCRIPTION_*), where AzurePipelinesCredential asks for tokens.
    # A pipeline missing from azureServiceConnections gets no service connection, and this step fails on the missing input.
    - task: AzureCLI@2
      displayName: 'Azure identity of the tests'
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnections[variables['Build.DefinitionName']] }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          foreach ($name in 'TENANT_ID', 'CLIENT_ID', 'SERVICE_CONNECTION_ID') {
              $value = [Environment]::GetEnvironmentVariable("AZURESUBSCRIPTION_$name")
              if (-not $value) { throw "AzureCLI@2 did not set AZURESUBSCRIPTION_$name" }
          }
          Write-Host "##vso[task.setvariable variable=E2E.TenantId]$env:AZURESUBSCRIPTION_TENANT_ID"
          Write-Host "##vso[task.setvariable variable=E2E.ServicePrincipalClientId]$env:AZURESUBSCRIPTION_CLIENT_ID"
          Write-Host "##vso[task.setvariable variable=E2E.ServiceConnectionId]$env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

    - ${{ each testRun in parameters.testRuns }}:
      # 'Rerun failed jobs' runs again only the categories that did not pass
      - task: DownloadPipelineArtifact@2
        displayName: '${{ testRun.displayName }}: download earlier test results'
        condition: and(succeeded(), gt(variables['System.JobAttempt'], 1))
        continueOnError: true
        inputs:
          buildType: 'current'
          itemPattern: 'test-results-${{ testRun.name }}-*/**'
          path: '$(Pipeline.Workspace)/earlier-test-results/${{ testRun.name }}'

      # Sets ${{ testRun.name }}TestCategories, ${{ testRun.name }}TestFilter and ${{ testRun.name }}RunsTests
      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: choose test categories'
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Select-TestCategories.ps1'
          arguments: >-
            -CategoriesByTag $env:CATEGORIES_BY_TAG
            -PreviousResultsFolder '$(Pipeline.Workspace)/earlier-test-results/${{ testRun.name }}'
            -VariablePrefix '${{ testRun.name }}'
        env:
          CATEGORIES_BY_TAG: ${{ convertToJson(testRun.categories) }}

      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: start sampling CPU and memory'
        condition: and(succeeded(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Measure-AgentResources.ps1'
          arguments: -Action Start -Folder '$(Agent.TempDirectory)/resources/${{ testRun.name }}'

      # Published per category in the next step, from the TRX; the NUnit XML gives the categories of its tests. The TRX is
      # not named after the test run: the TRX of a category is, and Windows file names ignore case (healthCheck, HealthCheck).
      # The longest category, RepeatSearchHappyPathTests_Cord, takes about 10 min.
      - task: DotNetCoreCLI@2
        displayName: '${{ testRun.displayName }}: run tests'
        condition: and(succeeded(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        timeoutInMinutes: 60
        inputs:
          command: 'test'
          publishTestResults: false
          arguments: >-
            $(Pipeline.Workspace)/dropTestSuite/Atlas.Auto.Tests/bin/Release/net10.0/Atlas.Auto.Tests.dll
            --no-restore
            --filter "$(${{ testRun.name }}TestFilter)"
            --logger "trx;LogFileName=${{ testRun.name }}-run.trx"
            --results-directory "$(Agent.TempDirectory)/TestResults/${{ testRun.name }}"
            ${{ coalesce(testRun.extraTestArguments, '') }}
            -- NUnit.TestOutputXml="$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/nunit"
        # The tests' Azure identity: the workload identity federation service connection named by the E2E.* pipeline
        # variables, through AzurePipelinesCredential (AzureCredentialFactory.cs). The pipeline must be allowed to use it.
        env:
          AZURESUBSCRIPTION_TENANT_ID: $(E2E.TenantId)
          AZURESUBSCRIPTION_CLIENT_ID: $(E2E.ServicePrincipalClientId)
          AZURESUBSCRIPTION_SERVICE_CONNECTION_ID: $(E2E.ServiceConnectionId)
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: CPU and memory'
        condition: and(always(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        continueOnError: true
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Measure-AgentResources.ps1'
          arguments: -Action Stop -Folder '$(Agent.TempDirectory)/resources/${{ testRun.name }}'

      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: publish test runs by category'
        condition: and(succeededOrFailed(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Publish-TestRunsByCategory.ps1'
          arguments: >-
            -TrxFile '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/${{ testRun.name }}-run.trx'
            -NUnitXmlFile '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/nunit/Atlas.Auto.Tests.xml'
            -Categories '$(${{ testRun.name }}TestCategories)'
            -OtherTitle '${{ testRun.name }}'

      # Read by 'choose test categories' of a rerun
      - task: PublishPipelineArtifact@1
        displayName: '${{ testRun.displayName }}: publish test results'
        condition: and(succeededOrFailed(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        continueOnError: true
        inputs:
          targetPath: '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/nunit'
          artifact: 'test-results-${{ testRun.name }}-$(System.JobAttempt)'
          publishLocation: 'pipeline'

      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: tag test runs'
        condition: and(succeededOrFailed(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        continueOnError: true
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Add-TestRunTags.ps1'
          arguments: >-
            -CollectionUri '$(System.CollectionUri)'
            -Project '$(System.TeamProject)'
            -BuildId $(Build.BuildId)
            -PublishedRunsFile '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/published-test-runs.txt'
            -CategoriesByTag $env:CATEGORIES_BY_TAG
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          CATEGORIES_BY_TAG: ${{ convertToJson(testRun.categories) }}
