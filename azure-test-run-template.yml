# Build, then one job on one agent that runs the test runs one after another. A test run is one dotnet test call over
# its categories; the tests run in parallel in that process (LevelOfParallelism in AssemblyInfo.cs). A test run starts
# only when the one before it passed.
# Scripts are in pipeline/ (the pipeline-scripts artifact of the build stage).
parameters:
# Each: name, displayName (also the tag of its test runs), categories, and optionally extraTestArguments (more dotnet
# test arguments).
- name: testRuns
  type: object
  default: []

stages:
- stage: build
  displayName: "Build"
  jobs:
  - job:
    displayName: 'Restore Cache and Build'
    pool:
      vmImage: 'windows-latest'
    variables:
      buildConfiguration: 'Release'
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET Core SDK'
        inputs:
          packageType: 'sdk'
          version: 10.0.x

      - task: FileTransform@2
        # Pipeline must have variables that match those in appsettings.json.
        # Use `.` to retrieve nested values, e.g., var name `Azure.Authentication.ClientId` maps to `{ "Azure": { "Authentication": { "ClientId": "value" } } }`
        displayName: 'Set environment variables'
        inputs:
          folderPath: '$(System.DefaultWorkingDirectory)'
          xmlTransformationRules: '' # Prevents task error: "Unable to apply transformation for the given package - Changes are already present in the package."
          jsonTargetFiles: '**/appsettings.json'
        continueOnError: false

      - task: DotNetCoreCLI@2
        displayName: 'Restore'
        inputs:
          command: 'restore'
          projects: "**/Atlas.Auto.Tests.csproj"
          feedsToUse: 'select'
          vstsFeed: $(ATLAS_AZURE_ARTIFACTS_FEED_NAME_OR_ID)
          includeNuGetOrg: true

      - task: DotNetCoreCLI@2
        displayName: 'Build'
        inputs:
          command: 'build'
          projects: '**/Atlas.Auto.Tests.csproj'
          arguments: '--configuration $(buildConfiguration) --no-restore'

      - task: CopyFiles@2
        displayName: 'Copy Test artifacts for later use in the pipeline'
        inputs:
          contents: 'Atlas.Auto.Tests/bin/Release/net10.0/**'
          targetFolder: '$(Build.ArtifactStagingDirectory)'

      - publish: '$(Build.ArtifactStagingDirectory)'
        displayName: 'Publish Test artifacts for later use in the pipeline'
        artifact: dropTestSuite

      - publish: '$(System.DefaultWorkingDirectory)/pipeline'
        displayName: 'Publish pipeline scripts'
        artifact: pipeline-scripts

# The test runs must not overlap: every one starts by removing all test donors (AssemblySetup).
- stage: tests
  displayName: "Tests"
  jobs:
  - job: Tests
    displayName: 'Tests run'
    pool:
      vmImage: 'windows-latest'
    # The test run timeouts are for a run that hangs; all the runs take about 20 min.
    timeoutInMinutes: 120
    steps:
    - checkout: none

    - download: current
      displayName: 'Download pipeline scripts'
      artifact: pipeline-scripts

    - download: current
      displayName: 'Download test binaries'
      artifact: dropTestSuite

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: 10.0.x

    - ${{ each testRun in parameters.testRuns }}:
      # 'Rerun failed jobs' runs again only the categories that did not pass
      - task: DownloadPipelineArtifact@2
        displayName: '${{ testRun.displayName }}: download earlier test results'
        condition: and(succeeded(), gt(variables['System.JobAttempt'], 1))
        continueOnError: true
        inputs:
          buildType: 'current'
          itemPattern: 'test-results-${{ testRun.name }}-*/**'
          path: '$(Pipeline.Workspace)/earlier-test-results/${{ testRun.name }}'

      # Sets ${{ testRun.name }}TestCategories, ${{ testRun.name }}TestFilter and ${{ testRun.name }}RunsTests
      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: choose test categories'
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Select-TestCategories.ps1'
          arguments: >-
            -Categories '${{ join(',', testRun.categories) }}'
            -PreviousResultsFolder '$(Pipeline.Workspace)/earlier-test-results/${{ testRun.name }}'
            -VariablePrefix '${{ testRun.name }}'

      # Published per category in the next step, from the TRX; the NUnit XML gives the categories of its tests. The TRX is
      # not named after the test run: the TRX of a category is, and Windows file names ignore case (healthCheck, HealthCheck).
      # The longest category, RepeatSearchHappyPathTests_Cord, takes about 10 min.
      - task: DotNetCoreCLI@2
        displayName: '${{ testRun.displayName }}: run tests'
        condition: and(succeeded(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        timeoutInMinutes: 60
        inputs:
          command: 'test'
          publishTestResults: false
          arguments: >-
            $(Pipeline.Workspace)/dropTestSuite/Atlas.Auto.Tests/bin/Release/net10.0/Atlas.Auto.Tests.dll
            --no-restore
            --filter "$(${{ testRun.name }}TestFilter)"
            --logger "trx;LogFileName=${{ testRun.name }}-run.trx"
            --results-directory "$(Agent.TempDirectory)/TestResults/${{ testRun.name }}"
            ${{ coalesce(testRun.extraTestArguments, '') }}
            -- NUnit.TestOutputXml="$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/nunit"

      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: publish test runs by category'
        condition: and(succeededOrFailed(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Publish-TestRunsByCategory.ps1'
          arguments: >-
            -TrxFile '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/${{ testRun.name }}-run.trx'
            -NUnitXmlFile '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/nunit/Atlas.Auto.Tests.xml'
            -Categories '$(${{ testRun.name }}TestCategories)'
            -OtherTitle '${{ testRun.name }}'

      # Read by 'choose test categories' of a rerun
      - task: PublishPipelineArtifact@1
        displayName: '${{ testRun.displayName }}: publish test results'
        condition: and(succeededOrFailed(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        continueOnError: true
        inputs:
          targetPath: '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/nunit'
          artifact: 'test-results-${{ testRun.name }}-$(System.JobAttempt)'
          publishLocation: 'pipeline'

      - task: PowerShell@2
        displayName: '${{ testRun.displayName }}: tag test runs'
        condition: and(succeededOrFailed(), eq(variables['${{ testRun.name }}RunsTests'], 'true'))
        continueOnError: true
        inputs:
          filePath: '$(Pipeline.Workspace)/pipeline-scripts/Add-TestRunTags.ps1'
          arguments: >-
            -CollectionUri '$(System.CollectionUri)'
            -Project '$(System.TeamProject)'
            -BuildId $(Build.BuildId)
            -PublishedRunsFile '$(Agent.TempDirectory)/TestResults/${{ testRun.name }}/published-test-runs.txt'
            -Tag '${{ testRun.displayName }}'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
