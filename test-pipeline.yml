# Set trigger as required for the target Atlas environment
trigger: none
pr: none

# Shown as a checkbox when the pipeline is run by hand; a triggered run takes the default.
parameters:
- name: changeFunctionAppSettings
  displayName: "Change Atlas function app settings for the tests that need them (restarts those apps; off: the tests are skipped)"
  type: boolean
  default: true

extends:
  template: azure-test-run-template.yml
  parameters:
    changeFunctionAppSettings: ${{ parameters.changeFunctionAppSettings }}
    # Pipeline name -> its environment: the variable group with its settings and the Azure service connection its tests
    # use. A pipeline needs its entry here before it can run. See "Pipeline Variables" in README.md.
    environments:
      '[DEV-ATLAS] Atlas E2E Tests':
        variableGroup: 'DEV-ATLAS Atlas E2E Tests'
        serviceConnection: 'Atlas Dev WIF'
    # categories: tag -> its categories. Each category is published as its own test run, tagged with its tag.
    testRuns:
    - name: healthCheck
      displayName: "Health Check"
      categories:
        HealthCheck:
        - HealthCheck
      # Prints the tests' progress output, so a ##vso warning from a health check shows on the run
      extraTestArguments: '--logger "console;verbosity=normal"'

    - name: donorImport
      displayName: "Donor Import"
      categories:
        DonorImport:
        - DonorImport_DiffModeHappyPathTests
        - DonorImport_DiffModeExceptionPathTests
        - DonorImport_FullModeExceptionPathTests

    - name: searchAndScoring
      displayName: "Search, Scoring & Repeat Search"
      categories:
        Search:
        - SearchHappyPathTests
        - Search_PrecomputedGenotypeSetTests
        - SearchExceptionPathTests
        Scoring:
        - ScoringHappyPathTests
        RepeatSearch:
        - RepeatSearchHappyPathTests_Adult
        - RepeatSearchHappyPathTests_Cord
        - RepeatSearchExceptionPathTests
